# Progressive Affixes Plugin
#
# Item level (ilvl) is the hidden level of the generated item.
# Change only the numbers below. Percentages on each row must total 100.

[plugin]
enabled = true

[magic]
# Force one prefix and one suffix from these item levels onward.
weapons_and_armor = 65
jewels_rings_and_amulets = 85
charms = 90

[rare_jewels]
# Force the number of affixes rolled on a Rare Jewel. The maximum is 4.
# Each row is [chance for 3 affixes, chance for 4 affixes].
from_level_1  = [50,   50]
from_level_45 = [37.5, 62.5]
from_level_65 = [25,   75]
from_level_85 = [0,    100]

[regular_rare_items]
# Applies to every Rare item except Rare Jewels.
# Each row is [chance for 3, 4, 5, and 6 affixes].
from_level_1  = [12.5, 37.5, 37.5, 12.5]
from_level_45 = [0,    25,   50,   25]
from_level_65 = [0,    0,    50,   50]
from_level_85 = [0,    0,    0,    100]

[crafted]
# Covers only the random affixes added to the recipe's fixed properties.
# Each row is [chance for 1, 2, 3, and 4 random affixes].
from_level_1  = [40, 20, 20, 20]
from_level_31 = [0,  60, 20, 20]
from_level_51 = [0,  0,  80, 20]
from_level_71 = [0,  0,  0,  100]
