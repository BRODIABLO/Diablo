# BKVince preset for the mod-local PotionAutoPickup plugin.
enabled = true
# Vanilla automatic gold pickup uses a server distance-cost limit of 4.
pickup_distance = 4
# Scan after every third supported player action packet.
minimum_interval_actions = 3
family_priority = ["rejuvenation", "healing", "mana"]

[healing]
enabled = true
# Supported types: hp1, hp2, hp3, hp4, hp5.
tiers = ["hp2", "hp3", "hp4", "hp5"]
columns = [1, 2]
# The legacy family-wide switch remains false; overflow_tiers is authoritative.
overflow_to_inventory = false
overflow_tiers = ["hp3", "hp4", "hp5"]
tier_priority = ["hp5", "hp4", "hp3", "hp2"]

[mana]
enabled = true
# Supported types: mp1, mp2, mp3, mp4, mp5.
tiers = ["mp2", "mp3", "mp4", "mp5"]
columns = [3, 4]
overflow_to_inventory = false
overflow_tiers = ["mp3", "mp4", "mp5"]
tier_priority = ["mp5", "mp4", "mp3", "mp2"]

[rejuvenation]
enabled = true
# Supported types: rvs, rvl.
tiers = ["rvs", "rvl"]
columns = [4]
overflow_to_inventory = false
overflow_tiers = ["rvs", "rvl"]
tier_priority = ["rvl", "rvs"]

[diagnostics]
enabled = false
log_scans = false
