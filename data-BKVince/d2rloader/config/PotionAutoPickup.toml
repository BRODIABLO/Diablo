# Potion Auto Pickup
# Potion codes are the exact values from the code column in misc.txt.
# The order of each potion_codes list is also its pickup priority.

enabled = true
pickup_range = 4
pickup_family_order = ["rejuvenation", "health", "mana"]

[health_potions]
enabled = true
potion_codes = ["hp5", "hp4", "hp3", "hp2"]
belt_columns = [1, 2]
# Only hp5 may use character inventory when belt columns 1 and 2 are full.
inventory_fallback_potion_codes = ["hp5"]

[mana_potions]
enabled = true
potion_codes = ["mp5", "mp4", "mp3"]
belt_columns = [3]
# Only mp5 may use character inventory when belt column 3 is full.
inventory_fallback_potion_codes = ["mp5"]

[rejuvenation_potions]
enabled = true
potion_codes = ["rvl", "rvs"]
belt_columns = [4]
# Both Full Rejuvenation and Rejuvenation may use character inventory.
inventory_fallback_potion_codes = ["rvl", "rvs"]

[advanced]
scan_every_player_actions = 1

[diagnostics]
enabled = true
log_scans = false
