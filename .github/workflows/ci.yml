name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision governed PD2 S13 affix source
        shell: pwsh
        run: |
          $mirrorRoot = Join-Path $env:RUNNER_TEMP 'pd2-affix-source'
          git -c core.autocrlf=false -c core.eol=lf clone --filter=blob:none --no-checkout https://github.com/Lukaszpg/PD2-Single-Player-Plus-mod.git $mirrorRoot
          git -C $mirrorRoot config core.autocrlf false
          git -C $mirrorRoot config core.eol lf
          git -C $mirrorRoot sparse-checkout init --cone
          git -C $mirrorRoot sparse-checkout set data/global/excel
          git -C $mirrorRoot fetch --depth=1 origin 3debc6781f33c3c1474a995b80369a4e618cd386
          git -C $mirrorRoot checkout --detach FETCH_HEAD
          $actualCommit = git -C $mirrorRoot rev-parse HEAD
          if ($actualCommit -ne '3debc6781f33c3c1474a995b80369a4e618cd386') {
            throw "PD2 affix mirror commit drift: $actualCommit"
          }
          $sourceRoot = Join-Path $mirrorRoot 'data/global/excel'
          "PD2_AFFIX_SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify repository
        run: npm run verify

      - name: Diagnose governed Highest-Level drift
        if: failure()
        shell: pwsh
        run: |
          @'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { buildHighestLevelReport, buildReport } from './scripts/migrate-bkvince/pd2-affixes-review.mjs';
          const sourceRoot = process.env.PD2_AFFIX_SOURCE_ROOT;
          const catalog = JSON.parse(fs.readFileSync('./Mission/pd2-affixes-merge.catalog.json', 'utf8'));
          const actual = `${JSON.stringify(buildHighestLevelReport(buildReport(sourceRoot, catalog), sourceRoot), null, 2)}\n`;
          const expected = fs.readFileSync('./Mission/pd2-affixes-highest-level.json', 'utf8');
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex').toUpperCase();
          const firstDifference = Array.from({ length: Math.max(actual.length, expected.length) }, (_, index) => index)
            .find((index) => actual[index] !== expected[index]);
          console.log(JSON.stringify({
            expectedSha256: sha(expected),
            actualSha256: sha(actual),
            expectedLength: expected.length,
            actualLength: actual.length,
            firstDifference,
            expectedContext: expected.slice(Math.max(0, firstDifference - 100), firstDifference + 100),
            actualContext: actual.slice(Math.max(0, firstDifference - 100), firstDifference + 100),
          }, null, 2));
          '@ | node --input-type=module -
