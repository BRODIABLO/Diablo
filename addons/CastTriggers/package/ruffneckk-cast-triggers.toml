# RuffnecKk Cast Triggers
# Triggers item skills from spells, attack attempts, and combat outcomes.

enabled = true

[on_cast]
# Empty means every eligible non-repeating spell. A non-empty list narrows
# source skills to these numeric Skills.txt IDs. It cannot opt attacks in.
include_skill_ids = []

# Applied after include_skill_ids. Use this for custom spells that should never
# activate cast-on-cast item properties.
exclude_skill_ids = []

[while_channeling]
# Repeating/channelled spells use the same item properties as ordinary casts.
enabled = true

# D2R runs at 25 server frames per second. The default 50 frames is 2 seconds.
# The first successful channel tick triggers immediately, then this interval
# limits how often another native item chance roll may occur.
interval_frames = 50

# Empty means every otherwise eligible repeating/channelled spell.
include_skill_ids = []

# Applied after include_skill_ids. Weapon attacks remain ineligible.
exclude_skill_ids = []

[combat_triggers]
# These IDs must match free ItemStatCost.txt IDs owned by the consuming
# mod. Set an unused trigger to 0. Nonzero IDs must be distinct.
attack_attempt_stat_id = 0
critical_strike_stat_id = 0
crushing_blow_stat_id = 0
open_wounds_stat_id = 0

[diagnostics]
# Retains the latest detailed events in a bounded in-memory trace. The
# cast-triggers console command always exposes counters and prints the retained
# entries when this setting is true.
enabled = false
